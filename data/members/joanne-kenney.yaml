about: |-
  I am a researcher with an interest in mental health, neuroscience and metabolic health, particularly the interactions between biological, psychological and environmental factors in shaping health outcomes. My work involves collaborative, multidisciplinary research, with a focus on improving our understanding of complex health conditions and translating research findings into meaningful benefits for patients and the wider community.

  I am particularly interested in the potential of emerging technologies, including artificial intelligence, multimodal data integration and advanced imaging, to transform health research. I am also keen to develop approaches to data harmonisation and cross-centre collaboration that enable researchers to make better use of complex datasets.
